name: Bug Report
description: Report a reproducible gameplay, editor, build, or visual defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Leave Me Alone. Please provide enough detail for another developer to reproduce the problem.

  - type: dropdown
    id: game_mode
    attributes:
      label: Game mode
      description: Where does the problem occur?
      options:
        - Single Player
        - Co-op / Multiplayer Client
        - Dedicated Server
        - Main Menu / Shared
        - Unity Editor only
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Runtime environment
      options:
        - Unity Editor Play Mode
        - Windows Client Build
        - Windows Dedicated Server Build
        - Linux Client Build
        - Linux Dedicated Server Build
        - Other
    validations:
      required: true

  - type: input
    id: unity_version
    attributes:
      label: Unity version
      description: The project default is Unity 6000.0.75f1.
      placeholder: "6000.0.75f1"
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Branch and commit
      description: Provide the branch name and commit hash where the issue occurs.
      placeholder: "develop @ 431b1d7"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: Describe the problem in one or two clear sentences.
      placeholder: The player camera stops rendering the world after entering the scene.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open GameStartScene.
        2. Enter Play Mode.
        3. Select Single Player.
        4. Observe the camera output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Describe what should happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Describe what happens instead.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction frequency
      options:
        - Always
        - Often
        - Sometimes
        - Once
        - Unknown
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or video
      description: Drag files here and include relevant Console, Player.log, or server log excerpts. Remove credentials and private IP information.
      placeholder: Attach evidence or write "Not available."

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Include recent changes, suspected components, affected scenes, prefabs, or assets.

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I tested this on the commit listed above.
          required: true
        - label: I removed secrets, access tokens, and private user data from the report.
          required: true
